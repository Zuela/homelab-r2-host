[Service]
# Crash-loop protection: bring homelab-cli back on failure every 10s,
# with a tight StartLimit window so a misconfigured secret doesn't
# retry forever.
Restart=on-failure
RestartSec=10s
StartLimitBurst=5
StartLimitIntervalSec=120

# If webhook-style clients keep failing, the daemon should not stall
# the whole restart budget. Limit socket backlog to keep a flood of
# /pct/exec calls from starving the audit append path.
OOMScoreAdjust=-100
