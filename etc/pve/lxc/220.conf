#Home Assistant in Docker. See ops/ARCHITECTURE.md and agent-net/buildout-next-steps/.
arch: amd64
cores: 2
features: nesting=1,keyctl=1
hostname: homeassistant
memory: 4096
nameserver: 192.168.4.1
net0: name=eth0,bridge=vmbr0,gw=192.168.4.1,hwaddr=BC:24:11:F1:73:61,ip=192.168.4.20/22,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-220-disk-0,size=32G
swap: 512
timezone: America/New_York
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
