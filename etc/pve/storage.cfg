dir: local
	path /var/lib/vz
	content backup,iso,vztmpl,import

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

pbs: r2-backup-target
	datastore r2-configs
	server 192.168.5.10
	content backup
	fingerprint 37:f2:8c:7c:3a:ac:2b:d3:8d:4c:84:8a:b1:21:b8:61:16:86:8c:88:e2:b9:f5:a3:12:85:5a:b8:00:16:ed:1c
	username r2-backup@pbs!r2-token

dir: r2-interim
	path /tank/backups-interim
	content backup
	is_mountpoint yes
	prune-backups keep-last=3

