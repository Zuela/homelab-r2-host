#AndR core data store Phase 1 (andr-ops 0053)%3A Postgres and Dagster in Docker. Staging, not system of record. /repo andr-data (ro), /soundcheck (ro), /backups nightly dumps.
arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: andr-data
memory: 8192
mp0: /tank/andr/andr-data,mp=/repo,backup=0,ro=1
mp1: /tank/andr/soundcheck,mp=/soundcheck,backup=0,ro=1
mp2: /tank/andr/andr-data-backups,mp=/backups,backup=0
mp3: /tank/andr/andr-data-raw,mp=/raw,backup=0
nameserver: 192.168.4.1
net0: name=eth0,bridge=vmbr0,gw=192.168.4.1,hwaddr=BC:24:11:76:E7:E2,ip=192.168.4.68/22,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-221-disk-0,size=40G
swap: 1024
timezone: America/New_York
unprivileged: 1
